# Install as /etc/systemd/system/glory-server.service.d/patches.conf
# after deploying a battle package containing BattleHotfixAgent and patcher runtime.
[Service]
StateDirectory=glory-battle-hotfix
Environment=GLORY_BATTLE_HOTFIX_DESIRED=/var/lib/glory-patches/battle-desired.json
Environment=GLORY_BATTLE_HOTFIX_STATUS=/var/lib/glory-battle-hotfix/status.json
Environment=GLORY_BATTLE_HOTFIX_INSTANCE=main
