[pytest]
# 让 `app` 包可被 import。pytest 从 backend/ 目录跑，这里的 "." 就是 backend/。
pythonpath = .
testpaths = tests

# 警告一律升级为错误：这个仓库的规矩是不留假绿，依赖弃用要当场看见，
# 而不是在某次升级后突然炸掉。
#
# 例外只给**我们改不了的第三方内部弃用**，且每条都写清楚出处。
# 依赖升级后这些行要回来重新确认还需不需要。
filterwarnings =
    error
    # starlette.testclient 自己用了 anyio 的弃用别名（starlette 1.6.0）。
    # 出在 starlette 内部，我们无法规避。
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
