name: Final status consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5
      - name: Check workbook against packaged data and code
        run: python tools/export_final_status.py --check
      - name: Verify drift detection
        run: python tools/test_final_runtime.py
